name: Strix AI Full Security Audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  full-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Strix
        run: |
          curl -sSL https://strix.ai/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Strix Penetration Test
        run: |
          strix -n -t ./ --model gemini/gemini-1.5-flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
