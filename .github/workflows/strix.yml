name: Strix AI Full Security Audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  full-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Strix
        run: |
          curl -sSL https://strix.ai/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Strix Penetration Test
        run: |
          strix -n -t ./ --scan-mode quick -m gemini/gemini-2.5-pro || strix -n -t ./ --scan-mode quick || true
        env:
          STRIX_LLM: "gemini/gemini-2.5-pro"
          MODEL: "gemini/gemini-2.5-pro"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Strix Audit Summary
        if: always()
        run: echo "Strix AI Security Audit process completed."
