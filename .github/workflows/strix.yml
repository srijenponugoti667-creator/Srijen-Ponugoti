name: Strix AI Full Security Audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  full-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Strix Full Penetration Test
        uses: usestrix/strix-action@main
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
